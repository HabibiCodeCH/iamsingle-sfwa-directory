name: Discover SFWA candidates

# Weekly, not daily — this is a lead list for a human to read, not a
# live feed; a topic tag on GitHub doesn't turn over fast enough to need
# more than that, and it keeps the search-API request volume low.
on:
  schedule:
    - cron: "23 5 * * 1" # once a week, Monday
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll GitHub topics for new candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/discover_candidates.py

      - name: Commit candidates if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json
          if git diff --cached --quiet; then
            echo "No new candidates."
          else
            git commit -m "chore: discover new SFWA candidates"
            git push
          fi
