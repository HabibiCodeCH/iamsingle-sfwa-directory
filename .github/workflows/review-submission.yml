name: Review submission

# Manually triggered by a maintainer after looking at the PR, not automatic
# on every incoming pull_request. This is deliberate: security_scan.py runs
# with contents:write / pull-requests:write. If this ran automatically on
# pull_request, checking out the PR's own branch would mean a submitter's
# PR could modify this very script and have it execute with that access —
# a classic GitHub Actions "pwn request". Instead this workflow always runs
# the scripts from the base branch (never the PR's checkout) and pulls only
# the PR's data/pending/*.json file(s) as plain data via `git show`, so
# PR-controlled code never executes here.
#
# Each submission PR adds exactly one new file under data/pending/ instead
# of rewriting the shared data/entries.json array. That's what lets PRs
# merge without conflicting with each other — see promote-pending.yml for
# the step that actually folds a merged pending file into entries.json.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch (trusted scripts only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: |
          pip install --quiet detect-secrets semgrep

      - name: Pull the PR's data/pending/*.json as data (not code)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}")
          HEAD_SHA=$(echo "$PR_JSON" | jq -r .head.sha)
          HEAD_REF=$(echo "$PR_JSON" | jq -r .head.ref)
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "HEAD_REF=$HEAD_REF" >> "$GITHUB_ENV"
          git fetch origin "$HEAD_SHA" --depth=1

          mkdir -p data/pending
          # List, then pull, each pending file the PR added — inert JSON
          # data read by our own scripts below, never executed.
          git ls-tree -r --name-only "$HEAD_SHA" -- data/pending/ > /tmp/pending-files.txt
          while IFS= read -r f; do
            [ -n "$f" ] && git show "$HEAD_SHA:$f" > "$f"
          done < /tmp/pending-files.txt

          rm -rf /tmp/pending-before-merge
          cp -r data/pending /tmp/pending-before-merge

      - name: Collect pending entries
        run: |
          python3 scripts/collect_pending.py > new_entries.json
          echo "Pending entries:"
          cat new_entries.json

      - name: Security scan
        run: python3 scripts/security_scan.py new_entries.json > scan_results.json

      - name: Check Hacker News for existing coverage
        # Heuristic leads only, not merged into data/entries.json — see
        # the script's own docstring. Never fails the job; an empty/failed
        # search just means no HN suggestions show up in the PR comment.
        run: python3 scripts/check_hn_featured.py new_entries.json > hn_candidates.json || echo "[]" > hn_candidates.json

      - name: Merge results into data/pending/*.json
        run: python3 scripts/merge_checks.py scan_results.json

      - name: Push results to the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same Contents-API approach as before, now per pending file
          # instead of the one shared entries.json — each file's own blob
          # sha is all that's needed, so this doesn't care that the rest
          # of the branch's history has diverged from a fast-forward push.
          # Same fork limitation as before: only works for PRs from
          # branches in this repo. Falls through to the PR comment below.
          CHANGED=0
          for f in data/pending/*.json; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            if ! diff -q "/tmp/pending-before-merge/$base" "$f" > /dev/null 2>&1; then
              CHANGED=1
              FILE_SHA=$(gh api "repos/${{ github.repository }}/contents/$f?ref=${{ env.HEAD_SHA }}" --jq .sha)
              gh api --method PUT "repos/${{ github.repository }}/contents/$f" \
                -f message="chore: record automated check results" \
                -f content="$(base64 -w0 "$f")" \
                -f sha="$FILE_SHA" \
                -f branch="${{ env.HEAD_REF }}" \
                > /dev/null || \
                echo "::warning::Could not push results for $f (likely a fork PR) — see the PR comment instead."
            fi
          done
          [ "$CHANGED" -eq 0 ] && echo "No check-result changes to commit."
          exit 0

      - name: Post results to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pendingEntries = require('fs').readdirSync('data/pending')
              .filter(f => f.endsWith('.json'))
              .map(f => JSON.parse(fs.readFileSync(`data/pending/${f}`, 'utf8')));
            const names = JSON.parse(fs.readFileSync('new_entries.json', 'utf8')).map(e => e.name);
            let hnResults = [];
            try { hnResults = JSON.parse(fs.readFileSync('hn_candidates.json', 'utf8')); } catch (e) {}

            let body = '### Automated submission review\n';
            body += '_Heuristic checks for a human reviewer — not a guarantee of safety or accuracy. Full per-test detail is on the card once merged._\n\n';

            for (const name of names) {
              const entry = pendingEntries.find(e => e.name === name);
              const checks = (entry && entry.checks) || [];
              const applicable = checks.filter(c => c.status !== 'skip');
              const passed = applicable.filter(c => c.status === 'pass').length;
              body += `**${name}** — ${passed}/${applicable.length} passed\n`;
              for (const c of checks) {
                const icon = c.status === 'pass' ? '✅' : c.status === 'fail' ? '❌' : '⏭️';
                body += `- ${icon} ${c.label}${c.detail ? ` — ${c.detail}` : ''}\n`;
              }

              const hn = hnResults.find(r => r.name === name);
              if (hn && hn.candidates.length) {
                body += `- 🔶 Possible Hacker News coverage — confirm before adding a \`featured\` entry:\n`;
                for (const c of hn.candidates) {
                  body += `  - [${c.title}](${c.url}) (${c.points ?? '?'} pts)\n`;
                }
              }
              body += '\n';
            }

            if (names.length === 0) {
              body += 'No pending entries found in this PR.\n';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body,
            });
