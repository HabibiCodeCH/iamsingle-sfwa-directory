name: Promote pending submissions

# Runs right after a merged submission PR lands its data/pending/*.json
# file on main. Folds it into data/entries.json and deletes the consumed
# pending file. Never touches PR-controlled code — by the time this runs,
# the pending file is already part of main's own history (post-merge),
# same trust level as any other commit here.
on:
  push:
    branches: [main]
    paths:
      - "data/pending/**"

# Serializes runs so two merges landing close together can't race each
# other reading/writing data/entries.json — a queued run always starts
# from whatever the previous run just committed, not a stale checkout.
concurrency:
  group: promote-pending
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # to dispatch build-pages.yml below — see that step's comment

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fold pending entries into data/entries.json
        run: python3 scripts/promote_pending.py

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/entries.json data/pending
          if git diff --cached --quiet; then
            echo "Nothing to promote."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: promote pending submission(s) into data/entries.json"
          git push
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      - name: Trigger the static build
        # A push made with this workflow's own GITHUB_TOKEN never fires
        # another workflow's `on: push` — GitHub suppresses that specifically
        # to stop recursive runs. build-pages.yml's push trigger above never
        # sees this commit, so it has to be dispatched explicitly instead.
        if: steps.commit.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-pages.yml --repo "${{ github.repository }}"
