name: Promote pending submissions

# Runs right after a merged submission PR lands its data/pending/*.json
# file on main. Folds it into data/entries.json and deletes the consumed
# pending file. Never touches PR-controlled code — by the time this runs,
# the pending file is already part of main's own history (post-merge),
# same trust level as any other commit here.
on:
  push:
    branches: [main]
    paths:
      - "data/pending/**"

# Serializes runs so two merges landing close together can't race each
# other reading/writing data/entries.json — a queued run always starts
# from whatever the previous run just committed, not a stale checkout.
concurrency:
  group: promote-pending
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # to dispatch build-pages.yml below — see that step's comment
  pull-requests: read # to look up each entry's originating PR, below

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record notifications, fold pending entries, commit, and push
        id: commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Several merges landing within seconds of each other (a batch of
          # submissions merged together) queue multiple runs of this
          # workflow via the concurrency group above, and only the first to
          # push wins — the rest hit a plain "git push" rejection. A retry
          # here isn't just re-pushing the same commit, though: another run
          # may have already consumed some of the same pending files, so
          # both scripts below have to run again against whatever main
          # actually looks like after the reset, not against this attempt's
          # now-stale result. record_pending_notifications.py is safe to
          # re-run — it reads the current data/pending/*.json fresh each
          # time and only appends entries not already queued.
          for attempt in 1 2 3 4 5; do
            python3 scripts/record_pending_notifications.py
            python3 scripts/promote_pending.py
            git add -A data/entries.json data/pending data/pending_notifications.json
            if git diff --cached --quiet; then
              echo "Nothing to promote."
              echo "promoted=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "chore: promote pending submission(s) into data/entries.json"
            if git push; then
              echo "promoted=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected, retrying ($attempt)..."
            git fetch origin main
            git reset --hard origin/main
            sleep $((attempt * 3))
          done
          echo "::error::push still failing after 5 attempts"
          exit 1

      - name: Trigger a star snapshot for the newly promoted repo(s)
        # Same suppression as below — snapshot-stars.yml's own push trigger
        # on data/entries.json never sees a commit made with this workflow's
        # token, so a promoted entry would sit at "n/a" stars until the next
        # daily cron otherwise. Dispatched explicitly; it chain-dispatches
        # build-pages.yml itself once the snapshot lands, so that one isn't
        # duplicated here — this just makes sure stars are fetched at all.
        if: steps.commit.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run snapshot-stars.yml --repo "${{ github.repository }}"

      - name: Trigger the static build
        # A push made with this workflow's own GITHUB_TOKEN never fires
        # another workflow's `on: push` — GitHub suppresses that specifically
        # to stop recursive runs. build-pages.yml's push trigger above never
        # sees this commit, so it has to be dispatched explicitly instead.
        # Runs regardless of the snapshot above, so the entry's page exists
        # even if that snapshot is delayed or fails — snapshot-stars.yml will
        # trigger a second, harmless build once stars actually land.
        if: steps.commit.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-pages.yml --repo "${{ github.repository }}"
