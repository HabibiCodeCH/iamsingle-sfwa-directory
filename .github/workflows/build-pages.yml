name: Build static pages

# Regenerates the pre-rendered catalog, per-entry pages, sitemap, robots.txt
# and llms.txt whenever the underlying data changes, so crawlers that don't
# execute JavaScript still see real content. Path-filtered to data files only
# (not index.html/entry/**/sitemap.xml/etc, which this workflow itself
# writes) so it can't trigger itself.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - data/entries.json
      - data/stars.json
      # A recheck PR (api/recheck.js) lands here by deleting an entry's cached
      # measurement, which makes screenshot.mjs re-measure it on this run.
      - data/network.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Screenshot new entries, measure size, generate OG cards
        run: node scripts/screenshot.mjs

      - name: Generate static pages
        run: node scripts/build_pages.mjs

      - name: Commit generated pages if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/network.json is committed so a measurement persists instead of
          # being redone every build. It's also a trigger path above, so this
          # push starts one more run — that run finds everything cached, writes
          # an identical file, produces no diff, and stops. No loop.
          git add index.html entry/ badge/ certified/ screenshot/ og/ qr/ assets/logos/ \
                  data/sizes.json data/network.json \
                  sitemap.xml robots.txt llms.txt feed.xml
          if git diff --cached --quiet; then
            echo "No page changes."
          else
            git commit -m "chore: regenerate static pages"
            git push
          fi
